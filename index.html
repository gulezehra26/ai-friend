
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Friend | Your Everyday Companion</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #fff0f5, #f8efff, #fff7f0);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .privacy-notice {
        text-align: center;
        font-size: 11px;
        color: #806779;
        padding: 0 10px 12px;
        background: #ffffff;
    }

    .chat-container {
        width: 430px;
        max-width: 100%;
        height: 650px;
        background: #ffffff;
        border-radius: 25px;
        box-shadow: 0 15px 50px rgba(190, 135, 160, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #f8e4ed;
    }

    .chat-header {
        background: linear-gradient(135deg, #f6d5e1, #eadcf8);
        color: #493342;
        padding: 24px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .logo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        flex-shrink: 0;
    }

    .header-text h2 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #493342;
    }

    .header-text p {
        margin: 5px 0 0;
        font-size: 12px;
        color: #624657;
    }

    .online-status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #493342;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background: #398653;
        border-radius: 50%;
    }

    .chat-messages {
        flex: 1;
        padding: 22px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: #fffafd;
    }

    .message {
        padding: 13px 16px;
        border-radius: 18px;
        max-width: 85%;
        line-height: 1.6;
        font-size: 14px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .bot-message {
        background: #f9eaf0;
        color: #493342;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }

    .user-message {
        background: #e9ddf5;
        color: #44334F;
        align-self: flex-end;
        border-bottom-right-radius: 5px;
    }

    .chat-input {
        display: flex;
        padding: 17px;
        background: #ffffff;
        border-top: 1px solid #f5e8ee;
        gap: 10px;
    }

    .chat-input input {
        flex: 1;
        min-width: 0;
        padding: 13px 16px;
        border: 1px solid #f0dce6;
        border-radius: 25px;
        outline: none;
        font-size: 14px;
        color: #493342;
        background: #fffafd;
        transition: 0.2s;
    }

    .chat-input input:focus {
        border-color: #d9a8c0;
        box-shadow: 0 0 0 3px rgba(217, 168, 192, 0.15);
    }

    .chat-input input::placeholder {
        color: #806779;
    }

    .chat-input button {
        background: linear-gradient(135deg, #e9b8ce, #d8bde9);
        color: #493342;
        border: none;
        border-radius: 25px;
        padding: 12px 21px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .chat-input button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(190, 135, 160, 0.2);
    }

    .chat-input button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .chat-messages::-webkit-scrollbar {
        width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: #efd5e1;
        border-radius: 10px;
    }

    @media (max-width: 480px) {
        body {
            padding: 10px;
        }

        .chat-container {
            height: 90vh;
            border-radius: 20px;
        }

        .chat-header {
            padding: 18px;
        }

        .chat-messages {
            padding: 16px;
        }
    }
</style>

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <div class="logo">🎀</div>

            <div class="header-text">
                <h2>AI Friend</h2>
                <p>Your everyday companion</p>
            </div>

            <div class="online-status">
                <span class="status-dot"></span>
                Online
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Welcome to AI Friend! Your friendly space for conversations, ideas, and everyday thoughts.
            </div>
        </div>

        <form class="chat-input" id="chatForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Write a message..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendButton">
                Send
            </button>
        </form>

        <p class="privacy-notice">
            Messages are processed by AI. Please don't share sensitive personal information.
        </p>

    </div>

    <script>

        // Backend API configuration
        const API_BASE_URL =
            window.location.protocol === "file:" ||
            window.location.hostname === "127.0.0.1" ||
            window.location.hostname === "localhost"
                ? "http://127.0.0.1:8000"
                : "YOUR_RENDER_BACKEND_URL";

        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("messageInput");
        const chatMessages = document.getElementById("chatMessages");
        const sendButton = document.getElementById("sendButton");

        // Unique session for this browser tab
        const sessionId = "customer_" + crypto.randomUUID();

        function addMessage(text, sender) {
            const message = document.createElement("div");

            message.classList.add("message");

            if (sender === "user") {
                message.classList.add("user-message");
            } else {
                message.classList.add("bot-message");
            }

            message.textContent = text;

            chatMessages.appendChild(message);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            messageInput.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/chat`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: message,
                            session_id: sessionId
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                addMessage(data.reply, "bot");

            } catch (error) {
                addMessage(
                    "Sorry, I couldn't connect to the AI. Please try again.",
                    "bot"
                );

                console.error(error);

            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        });

    </script>

</body>
</html>
